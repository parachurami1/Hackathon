version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_FILE: /var/www/html/site/database.sqlite
    # Ensure the database file is writable inside the container
    command: bash -c "chmod -R 777 /var/www/html/site && apache2-foreground"